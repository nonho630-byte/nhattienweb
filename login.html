<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Anon</title>
  <link rel="stylesheet" href="./assets/css/style-prefix.css">
  <link rel="stylesheet" href="./assets/css/product-detail.css">
  <link rel="stylesheet" href="./assets/css/pages.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>
  <main class="sub-page">
    <div class="container">
      <h1 class="page-title" style="text-align:center;">Tài khoản</h1>
      <div class="auth-box">
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-tab="login">Đăng nhập</button>
          <button type="button" class="auth-tab" data-tab="register">Đăng ký</button>
        </div>
        <form class="auth-form" id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" required placeholder="email@example.com">
          </div>
          <div class="form-group">
            <label for="login-pass">Mật khẩu</label>
            <input type="password" id="login-pass" name="password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn-auth">Đăng nhập</button>
        </form>
        <form class="auth-form" id="register-form" style="display:none;">
          <div class="form-group">
            <label for="reg-name">Họ và tên</label>
            <input type="text" id="reg-name" name="name" required>
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" name="email" required>
          </div>
          <div class="form-group">
            <label for="reg-pass">Mật khẩu</label>
            <input type="password" id="reg-pass" name="password" required>
          </div>
          <button type="submit" class="btn-auth">Đăng ký</button>
        </form>
        <p class="auth-message" id="auth-message"></p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="./assets/js/products.js"></script>
  <script src="./assets/js/cart.js"></script>
  <script src="./assets/js/wishlist.js"></script>
  <script src="./assets/js/layout.js"></script>
  <script src="./assets/js/translations.js"></script>
  <script src="./assets/js/i18n.js"></script>
  <script src="./assets/js/static-pages.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
</body>
</html>
