<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ - Anon</title>
  <link rel="stylesheet" href="./assets/css/style-prefix.css">
  <link rel="stylesheet" href="./assets/css/product-detail.css">
  <link rel="stylesheet" href="./assets/css/pages.css">
  <link rel="stylesheet" href="./assets/css/cart.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>
  <main class="sub-page">
    <div class="container">
      <h1 class="page-title">Liên hệ</h1>
      <div id="page-root" class="contact-layout">
        <div class="contact-info-box">
          <div class="contact-info-item">
            <ion-icon name="location-outline"></ion-icon>
            <div>
              <h4>Địa chỉ</h4>
              <p>419 State 414 Rte, Beaver Dams, New York(NY), 14812, USA</p>
            </div>
          </div>
          <div class="contact-info-item">
            <ion-icon name="call-outline"></ion-icon>
            <div>
              <h4>Điện thoại</h4>
              <p>(607) 936-8058</p>
            </div>
          </div>
          <div class="contact-info-item">
            <ion-icon name="mail-outline"></ion-icon>
            <div>
              <h4>Email</h4>
              <p>nonho@gmail.com</p>
            </div>
          </div>
          <div class="contact-info-item">
            <ion-icon name="time-outline"></ion-icon>
            <div>
              <h4>Giờ làm việc</h4>
              <p>8:00 - 23:00 (Thứ 2 - Chủ nhật)</p>
            </div>
          </div>
        </div>
        <form class="contact-form-box" id="contact-form">
          <h3 style="margin-bottom:20px;font-size:var(--fs-3);">Gửi tin nhắn</h3>
          <div class="form-group">
            <label for="name">Họ và tên</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="message">Nội dung</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button type="submit" class="btn-place-order">Gửi tin nhắn</button>
        </form>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="./assets/js/products.js"></script>
  <script src="./assets/js/cart.js"></script>
  <script src="./assets/js/wishlist.js"></script>
  <script src="./assets/js/layout.js"></script>
  <script src="./assets/js/translations.js"></script>
  <script src="./assets/js/i18n.js"></script>
  <script src="./assets/js/static-pages.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
</body>
</html>
